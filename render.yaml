services:
  - type: web
    name: smart-waste-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -c gunicorn.conf.py "app:create_app()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_STORAGE_BUCKET
        value: smart-waste-management-s-6225c.firebasestorage.app
      - key: DATABASE_URL
        fromDatabase:
          name: smart-waste-db
          property: connectionString
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

databases:
  - name: smart-waste-db
    databaseName: smart_waste
    user: smart_waste_user
    plan: free
